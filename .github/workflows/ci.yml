name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Compile package
        run: python -m compileall -q src tests
      - name: Run standard-library tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Build synthetic example
        env:
          PYTHONPATH: src
        run: |
          python -m evidence_office demo --out /tmp/evidence-office-demo
          python -m evidence_office build /tmp/evidence-office-demo/manifest.json --out /tmp/evidence-office-demo/dist
      - name: Audit built example for source drift
        env:
          PYTHONPATH: src
        run: python -m evidence_office audit /tmp/evidence-office-demo/manifest.json --package /tmp/evidence-office-demo/dist
